[aliases]
desc = ["util", "exec", "--", "sh", "-c", """jj describe -m "$(lazycommit pr @ | sed -n '1p')"""", ""]
push = ["git", "push", "--allow-new"]
rb = ["util", "exec", "--", "sh", "-c", 'jj rebase -r @ -d "$1"', ""]
sb = ["bookmark", "set"]
sn = ["util", "exec", "--", "sh", "-c", 'git fetch && jj new "$1" && if [ -n "$2" ]; then jj bookmark set "$2"; fi', ""]
sync = ["git", "fetch"]

[merge-tools.vimdiff]
program = "nvim"

[signing]
backend = "ssh"
behavior = "own"
key = "/Users/imcquee/.ssh/id_ed25519.pub"

[snapshot]
max-new-file-size = "150M"

[ui]
conflict-marker-style = "snapshot"
default-command = "log"
merge-editor = "vimdiff"

[user]
email = "imcqueendev@gmail.com"
name = "Isaac McQueen"
